name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        working-directory: backend
        run: ruff check .

      - name: ruff format --check
        working-directory: backend
        run: ruff format --check .

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest

    # 與舊版最重要的差異：測試跑在真實 Postgres 上，而非記憶體 SQLite。
    # 舊版「測試 SQLite／開發 MySQL／正式 Postgres」的三套資料庫落差，
    # 會讓原生 SQL、Enum 型別與交易隔離級別的行為無法在測試中被真正驗證。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      ENVIRONMENT: testing
      SECRET_KEY: ci-secret-key-with-more-than-32-characters-long
      JWT_SECRET_KEY: ci-jwt-secret-key-with-more-than-32-characters
      DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing

      # models 與 migration 不同步是很容易發生卻不會被測試抓到的問題：
      # 有人改了 model 卻忘記產生 migration，測試仍然全綠（因為測試庫是用
      # migration 建的，只是少了新欄位），直到部署才炸開。這一步讓 CI 直接擋下。
      - name: 檢查 models 與 migration 是否同步
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check
