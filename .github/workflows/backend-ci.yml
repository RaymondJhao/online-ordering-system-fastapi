name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        working-directory: backend
        run: ruff check .

      - name: ruff format --check
        working-directory: backend
        run: ruff format --check .

  # ---------------------------------------------------------------------------
  # 測試 job 於 Phase 2（認證層遷移）恢復啟用。
  #
  # 與舊版最重要的差異：測試不再跑在記憶體 SQLite 上，而是連到真實的 Postgres。
  # 舊版「測試用 SQLite、開發用 MySQL、正式用 Postgres」的三套資料庫落差，會讓
  # 原生 SQL（例如原子扣庫存的 UPDATE ... WHERE stock >= :qty）、Enum 型別與
  # 交易隔離級別的行為在測試中無法真正被驗證。
