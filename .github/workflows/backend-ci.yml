name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        working-directory: backend
        run: ruff check .

      - name: ruff format --check
        working-directory: backend
        run: ruff format --check .

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest

    # 與舊版最重要的差異：測試跑在真實 Postgres 上，而非記憶體 SQLite。
    # 舊版「測試 SQLite／開發 MySQL／正式 Postgres」的三套資料庫落差，
    # 會讓原生 SQL、Enum 型別與交易隔離級別的行為無法在測試中被真正驗證。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      ENVIRONMENT: testing
      SECRET_KEY: ci-secret-key-with-more-than-32-characters-long
      JWT_SECRET_KEY: ci-jwt-secret-key-with-more-than-32-characters
      DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379/0
      # 測試不需要正式環境的雜湊強度，調低可讓整套測試快上數十倍
      BCRYPT_ROUNDS: "4"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing

      # models 與 migration 不同步是很容易發生卻不會被測試抓到的問題：
      # 有人改了 model 卻忘記產生 migration，測試仍然全綠（因為測試庫是用
      # migration 建的，只是少了新欄位），直到部署才炸開。這一步讓 CI 直接擋下。
      - name: 檢查 models 與 migration 是否同步
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 建置成功本身就是驗證：多階段建置、pyproject 打包、非 root 使用者
      # 任何一環出錯都會在這裡失敗，而不是等到部署當下。
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: ordering-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 只驗證「應用程式能不能啟動」。沒有資料庫與 Redis 時 /health 會回 503，
      # 那是預期行為；重點在於映像不會因為缺少相依套件或路徑錯誤而直接崩潰。
      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 \
            -e ENVIRONMENT=production \
            -e SECRET_KEY=ci-smoke-test-secret-key-longer-than-32 \
            -e JWT_SECRET_KEY=ci-smoke-test-jwt-key-longer-than-32-ch \
            -e DATABASE_URL=postgresql://u:p@127.0.0.1:5432/none \
            -e REDIS_URL=redis://127.0.0.1:6379/0 \
            -e SCHEDULER_ENABLED=false \
            ordering-backend:ci
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || true)
            if [ "$code" = "503" ] || [ "$code" = "200" ]; then
              echo "應用程式已啟動並回應（HTTP $code）"; exit 0
            fi
            sleep 2
          done
          echo "應用程式未在時限內回應"; docker logs api; exit 1
