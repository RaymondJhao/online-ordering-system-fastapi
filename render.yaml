# Render 部署設定。
#
# 與 Flask 版的差異：
# 1. 啟動指令從 `gunicorn app:app`（WSGI）改為 uvicorn。FastAPI 是 ASGI 應用，
#    用 WSGI server 啟動會直接失敗。
# 2. 部署前先跑 alembic upgrade head。舊版靠 db.create_all()，schema 一旦
#    有資料就無法再變更；改用 migration 之後，部署流程必須包含套用遷移。
# 3. 新增 Redis：JWT 撤銷名單、API 限流與排程的分散式鎖都依賴它。
#
# ---------------------------------------------------------------------------
# 為什麼這裡沒有宣告 databases:
# ---------------------------------------------------------------------------
# Render 免費方案的 PostgreSQL 建立後 30 天到期，之後有 14 天寬限期，
# 逾期資料會被刪除。重建時會拿到**全新的連線字串**，若用 `fromDatabase`
# 綁定，blueprint 與實際資料庫的對應關係會斷掉，狀態變得難以預期。
#
# 因此資料庫改為在 Dashboard 手動建立，DATABASE_URL 設為 sync: false 由人工填入。
# 搭配下方的 preDeployCommand，重建流程只剩「貼上新的 Internal Database URL」
# 這一步——結構與展示資料都會自動重建。完整步驟見 README 的部署章節。

services:
  # Render 已將 Redis 更名為 Key Value；`type: redis` 目前仍是可用的別名，
  # 但官方文件已標記為 deprecated，直接用新名稱避免日後被移除。
  - type: keyvalue
    name: ordering-redis
    plan: free
    # region 省略時預設是 oregon，而 web service 指定了 singapore。
    # Render 的內部私有網路是以 region 為界的，跨區的 fromService 連線字串
    # 連不到——服務會正常啟動，直到第一個需要 Redis 的請求（登入、限流）才失敗。
    # 手動建立的 PostgreSQL 也必須選 Singapore，否則 Internal Database URL 同樣無效。
    region: singapore
    # 只有同一個 Render 帳號內的服務可以連線
    ipAllowList: []

  - type: web
    name: ordering-backend
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    # 明確指定分支。Render 的文件把 branch 的預設值標為 master，實際行為則是
    # 取 repo 的預設分支——寫死可以省掉「到底用哪個」的不確定性。
    branch: main

    # 指向 liveness 而非 readiness。若健康檢查在資料庫不通時回 503，
    # Render 會判定實例不健康並反覆重啟——而免費方案的資料庫每 30 天
    # 就有一段需要重建的空窗期，那時最不需要的就是重啟迴圈。
    healthCheckPath: /health/live

    buildCommand: pip install --upgrade pip && pip install .

    # ---------------------------------------------------------------------
    # 為什麼遷移寫在 startCommand 而不是 preDeployCommand：
    # ---------------------------------------------------------------------
    # preDeployCommand 只提供給付費方案（官方文件：「available for paid web
    # services, private services, and background workers」）。本服務是 plan: free，
    # 設了也不會執行，結果會是「部署成功但 schema 從未建立」——啟動沒事，
    # 第一個打到資料庫的請求才炸，是最難追的失敗模式。
    #
    # 折衷做法是把遷移併進 startCommand。alembic upgrade 是冪等的，重複執行
    # 無副作用；免費方案只有一個 instance，不會有多實例同時遷移的競態。
    # 代價是每次重啟都多幾秒啟動時間，而冷啟動本來就要等，影響有限。
    # 升級到付費方案後應改回 preDeployCommand。
    #
    # --if-empty 讓 seed 對一般部署無作用，只有重建後的第一次部署會實際執行。
    #
    # 免費方案只有一個 instance，但仍設定為 2 個 worker：
    # 排程的 Redis 分散式鎖會確保逾時訂單只被處理一次。
    startCommand: >-
      alembic upgrade head &&
      python -m scripts.seed --if-empty &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2

    envVars:
      # 不指定的話，Render 會用「服務建立當下」的預設版本——目前是 3.14.3。
      # 本專案 requires-python >=3.12，語法上不會被擋，但 CI 與 Dockerfile 都是
      # 3.12，正式環境跑一個從沒測過的直譯器（且 asyncpg / greenlet / bcrypt
      # 這類 C 擴充在新版未必有 wheel，會退回原始碼編譯）不是划算的賭注。
      # 用環境變數指定時必須寫完整版號。
      - key: PYTHON_VERSION
        value: "3.12.13"

      - key: ENVIRONMENT
        value: production

      # 手動填入 Render Dashboard 上 PostgreSQL 的 Internal Database URL。
      # 平台給的是 postgresql://，app/core/config.py 會自動補上 asyncpg driver
      # 並清掉 asyncpg 不認得的 sslmode / channel_binding 參數。
      - key: DATABASE_URL
        sync: false

      - key: REDIS_URL
        fromService:
          name: ordering-redis
          type: keyvalue
          property: connectionString

      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: BCRYPT_ROUNDS
        value: "12"

      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: UNPAID_ORDER_TIMEOUT_MINUTES
        value: "15"

      # 前端的 Vercel 正式網域；preview 部署用下面的 regex 放行
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        sync: false

      - key: ECPAY_MERCHANT_ID
        sync: false
      - key: ECPAY_HASH_KEY
        sync: false
      - key: ECPAY_HASH_IV
        sync: false
      - key: ECPAY_RETURN_URL
        sync: false
