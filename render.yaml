databases:
  - name: ordering-db
    plan: free

services:
  - type: web
    name: ordering-backend
    env: python
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ordering-db
          property: connectionString
