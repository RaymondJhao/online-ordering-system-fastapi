[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "online-ordering-system"
version = "0.1.0"
description = "線上點餐系統後端 API（FastAPI + async SQLAlchemy）"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.20",   # OAuth2 form 登入、綠界 callback 的 form-encoded body

    # 資料層（全面 async）
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",

    # 設定與驗證
    # [email] extra 是必要的，不是可有可無：app/schemas/auth.py 用了 EmailStr，
    # 而 pydantic v2 會在「建立 model 類別時」就嘗試 import email_validator，
    # 缺少會在 import 階段直接拋 ImportError，而非等到實際驗證資料時。
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.7.0",

    # 認證
    "pyjwt>=2.10.0",
    "bcrypt>=4.2.0",

    # 快取／限流／背景排程
    # 限流未使用 fastapi-limiter：它在 0.2 版改為 pyrate_limiter 的薄包裝，
    # API 與多數文件不符。改以 Redis Lua 腳本自行實作，見 core/rate_limit.py。
    "redis>=5.2.0",
    "apscheduler>=3.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "testcontainers[postgres]>=4.9.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Ruff：取代舊專案缺少的 lint 環節，CI 會跑 `ruff check` 與 `ruff format --check`
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
# 刻意不排除任何目錄：migration 與腳本都是正式程式碼，
# alembic.ini 的 post_write_hooks 也會在產生 migration 後自動套用 ruff。

[tool.ruff.lint]
select = [
    "E",     # pycodestyle 錯誤
    "W",     # pycodestyle 警告
    "F",     # pyflakes
    "I",     # isort：import 排序
    "N",     # pep8-naming
    "UP",    # pyupgrade：套用新版 Python 語法
    "B",     # flake8-bugbear：常見陷阱
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "ASYNC", # flake8-async：async 專用檢查，會抓出 event loop 阻塞
    "S",     # flake8-bandit：安全性檢查
    "RUF",   # ruff 專屬規則
]
ignore = [
    "E501",  # 行長由 formatter 處理
    "B008",  # FastAPI 的 Depends() 必須寫在預設值，與此規則衝突
    # RUF001~003 會把中文全形標點（，、「」）判定為「可能誤用的相似字元」。
    # 本專案的註解與錯誤訊息刻意使用繁體中文，全形標點是正確寫法，故關閉。
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",  # 測試本來就要用 assert
    "S105",  # 測試中寫死的假密碼／假 token
    "S106",
    "S603",  # conftest 以子行程執行 alembic，參數由程式碼固定，非外部輸入
    "S607",
    # 測試函式名稱刻意使用中文，pytest 輸出可直接當作規格說明閱讀，
    # 例如 test_原子扣庫存在庫存不足時不會扣減。與 N802 的英文命名規則衝突。
    "N802",
]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["app"]
# 沒有這一行，覆蓋率報告會嚴重低估。SQLAlchemy 的 async 支援是用 greenlet
# 實作的，每次 await 資料庫操作都會切換 greenlet；coverage 預設的追蹤器
# 在切換後會跟丟執行的frame，導致「await 之後的每一行」都被算成未覆蓋。
# 症狀很好認：測試明明通過，report 卻顯示函式主體大半沒被執行到。
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pragma: no cover",
]
