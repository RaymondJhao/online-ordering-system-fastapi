version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: food_ordering_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: online_ordering_system
      MYSQL_USER: order_user
      MYSQL_PASSWORD: order_password_123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: food_ordering_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  mysql_data:
