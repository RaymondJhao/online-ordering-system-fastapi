services:
  db:
    image: postgres:16-alpine
    container_name: ordering_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: online_ordering_system
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # healthcheck 讓應用端可以用 depends_on.condition 等資料庫真的可連線，
    # 而不是只等容器「啟動」——Postgres 容器起來後還要幾秒才會接受連線。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d online_ordering_system"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ordering_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # Redis 同時承擔 JWT blocklist 與 API 限流；資料遺失會導致已撤銷的 token
    # 復活，因此開啟 AOF 持久化。
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
